spring.application.name=ufs
spring.config.import=optional:file:.env[.properties]

# Puerto
server.port=${PORT:10000}

# PostgreSQL - Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dialecto
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JSON
spring.jackson.serialization.indent-output=false


# Evita consultas repetidas al cargar listas (tags, ítems de compra)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Validación de tokens de Supabase (configura UNA de las dos en Render)
supabase.jwt.jwks-url=${SUPABASE_JWKS_URL:https://taakswrwgqxfauyfhcia.supabase.co/auth/v1/.well-known/jwks.json}

# Orígenes permitidos para CORS (separados por coma). Por defecto, todos.
app.cors.allowed-origins=${CORS_ORIGINS:*}
